apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ai
spec:
  ports:
    - name: http
      port: 11434
      targetPort: 11434
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ollama
  namespace: ai
subsets:
  - addresses:
      - ip: 192.168.0.59   # your Pi’s LAN IP
    ports:
      - port: 11434
