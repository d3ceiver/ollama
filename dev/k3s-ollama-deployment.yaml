apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: ollama-storage
                    operator: In
                    values:
                      - "true"
      containers:
        - name: ollama
          image: ollama/ollama:0.12.6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"
            - name: OLLAMA_DEBUG
              value: "1"
            - name: OLLAMA_ORIGINS
              value: '["*"]'
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
          resources:
            requests:
              cpu: "2"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
            - name: host-certs
              mountPath: /etc/ssl/certs
              readOnly: true
          # 🧰 Install essential tools and start Ollama
          command: ["/bin/sh"]
          args:
            - "-c"
            - |
              echo "🔧 Preparing Ollama environment..." && \
              apt update && \
              apt install -y curl jq bash vim nano python3 ca-certificates && \
              update-ca-certificates && \
              echo "✅ Environment ready. Starting Ollama..." && \
              /bin/ollama serve
      volumes:
        - name: ollama-models
          persistentVolumeClaim:
            claimName: ollama-data
        - name: host-certs
          hostPath:
            path: /etc/ssl/certs
            type: Directory
