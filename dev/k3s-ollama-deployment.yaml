apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: ollama-storage
                    operator: In
                    values:
                      - "true"
      containers:
        - name: ollama
          image: ollama/ollama:0.12.6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"
            - name: OLLAMA_DEBUG
              value: "1"
            - name: OLLAMA_ORIGINS
              value: '["*"]'
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
          resources:
            requests:
              cpu: "2"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
            # ✅ Mount host CA certs so HTTPS works
            - name: host-certs
              mountPath: /etc/ssl/certs
              readOnly: true
      volumes:
        - name: ollama-models
          persistentVolumeClaim:
            claimName: ollama-data
        # ✅ Mount host certificates
        - name: host-certs
          hostPath:
            path: /etc/ssl/certs
            type: Directory

